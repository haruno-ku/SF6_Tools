<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zangief Modern 接続マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Page template for tools/lua/report.lua. The model is written in at the
   marker in the script at the bottom; nothing here fetches anything. */
:root {
  --ground: #eef0f4;
  --surface: #ffffff;
  --sunk: #e4e7ed;
  --ink: #151a24;
  --muted: #5b6474;
  --rule: #d5dae2;
  --accent: #2f55d4;
  --accent-ink: #ffffff;

  --v-link: #11905a;
  --v-combo_broke: #e0891c;
  --v-whiff: #c2452f;
  --v-blocked: #8659c4;
  --v-wrong_move: #bcc2cc;
  --v-a_failed: #969eab;
  --v-inconclusive: #a7aebb;
  --v-unknown: #ff00aa;
  --untried: transparent;
  --hatch: rgba(21, 26, 36, .38);
  --band-single: #dff1e8;
  --band-bad: #f6e3dc;

  --f-display: "Chakra Petch", "IBM Plex Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans JP", "Yu Gothic UI", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --cell: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1117;
    --surface: #161a22;
    --sunk: #1d222c;
    --ink: #e6e9ef;
    --muted: #97a0ae;
    --rule: #2a303b;
    --accent: #7d97ff;
    --accent-ink: #0e1117;
    --v-link: #35c27c;
    --v-combo_broke: #f0a13f;
    --v-whiff: #e2654e;
    --v-blocked: #a988e2;
    --v-wrong_move: #4a515d;
    --v-a_failed: #636b78;
    --v-inconclusive: #565e6b;
    --hatch: rgba(230, 233, 239, .42);
    --band-single: #173226;
    --band-bad: #3a231d;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1117;
  --surface: #161a22;
  --sunk: #1d222c;
  --ink: #e6e9ef;
  --muted: #97a0ae;
  --rule: #2a303b;
  --accent: #7d97ff;
  --accent-ink: #0e1117;
  --v-link: #35c27c;
  --v-combo_broke: #f0a13f;
  --v-whiff: #e2654e;
  --v-blocked: #a988e2;
  --v-wrong_move: #4a515d;
  --v-a_failed: #636b78;
  --v-inconclusive: #565e6b;
  --hatch: rgba(230, 233, 239, .42);
  --band-single: #173226;
  --band-bad: #3a231d;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.6 var(--f-body);
  padding-inline: clamp(16px, 4vw, 48px);
  padding-block: 32px 64px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
p { margin: 0; max-width: 68ch; }
.mono, code { font-family: var(--f-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- header --------------------------------------------------------- */
header { display: grid; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; font: 12px/1.5 var(--f-mono); color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }

/* --- summary ------------------------------------------------------- */
.summary { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: grid; gap: 14px; align-content: start; }
.big { font: 600 40px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.big small { font: 500 14px var(--f-body); color: var(--muted); margin-left: 6px; }
.stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.stack span { display: block; height: 100%; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 16px; font-size: 13px; }
.key { display: flex; align-items: baseline; gap: 8px; }
.key i { flex: none; width: 10px; height: 10px; border-radius: 2px; transform: translateY(1px); }
.key .n { margin-left: auto; font-family: var(--f-mono); }
.key.unanswered-group { color: var(--muted); }

/* --- log switcher ---------------------------------------------------- */
.logs { display: flex; flex-wrap: wrap; gap: 8px; }
.logs button {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 12px; cursor: pointer; text-align: left; display: grid; gap: 2px;
}
.logs button:hover { border-color: var(--muted); }
.logs button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.logs .name { font: 500 13px var(--f-mono); }
.logs .sub { font-size: 12px; opacity: .72; }

/* --- the matrix ------------------------------------------------------ */
.board { display: grid; grid-template-columns: minmax(0, max-content) minmax(260px, 1fr); gap: 16px; align-items: start; }
.scroller { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; }
table.grid { border-collapse: separate; border-spacing: 2px; }
.grid th { font-weight: 400; }
.grid thead .band th { font: 500 11px/1.3 var(--f-body); padding: 4px 6px; text-align: left; border-radius: 3px; white-space: nowrap; }
.grid thead .band th.single { background: var(--band-single); }
.grid thead .band th.repeat, .grid thead .band th.followup, .grid thead .band th.unreadable { background: var(--band-bad); }
.grid thead .cols th { vertical-align: bottom; padding: 0 0 4px; height: 128px; }
.colhead { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.colhead .id { font: 11px var(--f-mono); color: var(--muted); }
.rowhead { text-align: right; padding-right: 8px; white-space: nowrap; font-size: 12px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.rowhead .id { font: 11px var(--f-mono); color: var(--muted); margin-left: 6px; }
.grid td { padding: 0; }
.cell {
  display: block; width: var(--cell); height: var(--cell); padding: 0; border: 0; border-radius: 3px;
  background: var(--untried); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; position: relative;
}
.cell[data-v] { box-shadow: none; }
.cell.bad::after {
  content: ""; position: absolute; inset: 0; border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 5px);
}
.cell[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
.void { display: block; width: var(--cell); height: var(--cell); }
.gridnote { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; }
.gridnote span { display: inline-flex; gap: 6px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; position: relative; }

/* --- detail ---------------------------------------------------------- */
.detail { position: sticky; top: 16px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.chain { font: 600 18px/1.35 var(--f-body); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.chain .arrow { color: var(--muted); font-weight: 400; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 999px; font: 500 12px var(--f-mono); background: var(--sunk); }
.pill i { width: 8px; height: 8px; border-radius: 50%; }
.reason { font: 12px/1.5 var(--f-mono); background: var(--sunk); padding: 8px 10px; border-radius: 4px; overflow-wrap: anywhere; }
.warn { font-size: 13px; padding: 10px 12px; border-radius: 4px; background: var(--band-bad); }

/* --- routes ---------------------------------------------------------- */
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.route .steps { font: 600 15px var(--f-body); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.route .steps .arrow { color: var(--muted); font-weight: 400; }
.route .note { font-size: 12.5px; color: var(--muted); }
.route table { border-collapse: separate; border-spacing: 2px; font: 11px var(--f-mono); color: var(--muted); }
.route th { font-weight: 400; padding: 0 4px; text-align: right; }
.route thead th { text-align: center; padding: 0 0 2px; }
.route .axis { font: 11px var(--f-body); color: var(--muted); white-space: nowrap; }
.rcell { display: block; width: 20px; height: 20px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--rule); }
.rcell[data-v] { box-shadow: none; }

details { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 500; }
details ul { margin: 10px 0 0; padding-left: 18px; font: 12px/1.7 var(--f-mono); columns: 2 280px; }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 16px; }

/* --- combo list ---------------------------------------------------- */
.combos-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
.combos-head .rule { font-size: 13px; color: var(--muted); }
.combo-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
.combo { display: grid; grid-template-columns: 76px minmax(0, 1fr) 210px; gap: 8px 20px; padding: 16px 20px; align-items: start; }
.combo + .combo { border-top: 1px solid var(--rule); }
.status { font: 600 12px/1 var(--f-body); padding: 5px 0; border-radius: 4px; text-align: center; letter-spacing: .04em; }
.status.confirmed { background: var(--v-link); color: var(--surface); }
.status.once { background: transparent; color: var(--v-combo_broke); box-shadow: inset 0 0 0 1.5px var(--v-combo_broke); }
.combo .moves { display: grid; gap: 6px; min-width: 0; }
.combo .chain { font-size: 19px; }
.combo .classic { font: 500 13px var(--f-mono); color: var(--muted); }
.combo .alt { font-size: 12.5px; color: var(--muted); }
.combo .gaps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.combo .gaps span { font: 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 3px; background: var(--sunk); }
.combo .stats { display: grid; gap: 2px; text-align: right; }
.combo .stats .links { font: 600 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.combo .stats .links small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 3px; }
.combo .stats .breakdown { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.combo .stats .dmg { font-size: 12px; color: var(--v-combo_broke); }
.empty { padding: 20px; color: var(--muted); }

@media (max-width: 640px) {
  .combo { grid-template-columns: minmax(0, 1fr); }
  .combo .stats { text-align: left; grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 12px; }
}

@media (max-width: 980px) {
  .summary, .board { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">SF6 Combo Explorer — 実機スイープの記録</div>
    <h1 id="h1">接続マップ</h1>
    <p>ここにあるのは、ゲームが実際に答えたことだけです。フレーム表からの予測は1つも含みません。</p>
    <div class="meta" id="meta"></div>
  </header>

  <section style="display:grid;gap:12px" aria-labelledby="h-combos">
    <div class="combos-head">
      <h2 id="h-combos">繋がったコンボ</h2>
      <span class="rule" id="combo-rule"></span>
    </div>
    <ol class="combo-list" id="combos"></ol>
  </section>

  <section class="summary" aria-label="概要">
    <div class="panel" id="sum-log"></div>
    <div class="panel" id="sum-press"></div>
  </section>

  <section style="display:grid;gap:12px" aria-labelledby="h-logs">
    <h2 id="h-logs">ペア総当たり</h2>
    <p class="muted">マスは1つのログの中で、そのペアの試行が何を返したかを表します。ログは実験の順に並んでいて、後のログは前のログで見えたことを受けて取り直したものです。</p>
    <div class="logs" id="logs" role="group" aria-label="表示するログ"></div>
  </section>

  <section class="board">
    <div>
      <div class="scroller"><table class="grid" id="grid"></table></div>
      <div class="gridnote" id="gridnote"></div>
    </div>
    <aside class="panel detail" id="detail" aria-live="polite"></aside>
  </section>

  <section style="display:grid;gap:12px" aria-labelledby="h-routes">
    <h2 id="h-routes">ルート実走（ground truth）</h2>
    <p class="muted">操作者が「繋がる」と知っているコンボを、隙間の組み合わせごとに走らせた結果です。
      行が1つ目の隙間、列が2つ目の隙間（tick）です。</p>
    <div class="routes" id="routes"></div>
  </section>

  <details id="elsewhere"></details>

  <footer id="footer"></footer>
</div>

  const dl = el("dl");
  const row = (k, v) => dl.append(el("dt", { text: k }), el("dd", {}, v));
  row("予測の確度", pair.confidence || "—");
  row("予測マージン", pair.margin_frames == null ? "—" : `${pair.margin_frames} F`);
  if (c) {
    row("試行", el("span", { class: "num", text: String(c.rows) }));
    row("内訳", Object.entries(obj(c.verdicts)).map(([v, n]) => `${LABEL[v] || v} ${n}`).join(" / "));
    if (c.delays && c.delays.length) row("隙間 (tick)", el("span", { class: "mono", text: c.delays.map(d => d.delay).join(", ") }));
    if (c.actions_seen) row("見えた action", el("span", { class: "mono", text: c.actions_seen.join(" → ") }));
  }
  box.append(dl);
  if (c && c.reason) box.append(el("div", { class: "reason", text: c.reason }));
}

/* --- routes ------------------------------------------------------ */
function renderRoutes() {
  const box = $("routes");
  box.replaceChildren();
  if (!MODEL.route_logs.length) { box.append(el("p", { class: "muted", text: "ルート実走のログはまだありません。" })); return; }
  for (const r of MODEL.route_logs) {
    const v = obj(r.counts.verdicts);
    const card = el("article", { class: "panel route" });
    card.append(el("div", { class: "eyebrow", text: r.name }));
    if (r.steps) {
      const steps = el("div", { class: "steps" });
      r.steps.forEach((s, i) => { if (i) steps.append(el("span", { class: "arrow", text: "→" })); steps.append(s.notation); });
      card.append(steps);
    } else {
      card.append(el("div", { class: "steps mono", text: r.route_id }));
    }
    card.append(el("div", { class: "num", style: "font-size:13px" },
      el("b", { text: String(v.link || 0) }), ` / ${r.counts.rows} 試行が繋がった · ${fmtTime(r.first_at)}`));

    const axes = r.gap_axes || [];
    const cells = obj(r.cells);
    const scroller = el("div", { style: "overflow-x:auto" });
    const t = el("table");
    const cellFor = gk => {
      const c = cells[gk];
      return el("span", { class: "rcell", "data-v": c ? c.verdict : null, style: c ? `background:${color(c.verdict)}` : null,
        title: c ? `${gk}: ${LABEL[c.verdict] || c.verdict} (${c.rows})\n${c.reason || ""}` : `${gk}: 未試行`,
        role: "img", "aria-label": `隙間 ${gk}: ${c ? LABEL[c.verdict] || c.verdict : "未試行"}` });
    };
    if (axes.length >= 2) {
      const head = el("tr", {}, el("th", { class: "axis", text: "1↓ 2→" }));
      axes[1].forEach(g => head.append(el("th", { text: String(g) })));
      t.append(el("thead", {}, head));
      const body = el("tbody");
      for (const g1 of axes[0]) {
        const tr = el("tr", {}, el("th", { text: String(g1) }));
        for (const g2 of axes[1]) tr.append(el("td", {}, cellFor(`${g1}/${g2}`)));
        body.append(tr);
      }
      t.append(body);
    } else if (axes.length === 1) {
      const head = el("tr", {}, el("th", { class: "axis", text: "隙間→" }));
      const tr = el("tr", {}, el("th"));
      for (const g of axes[0]) { head.append(el("th", { text: String(g) })); tr.append(el("td", {}, cellFor(String(g)))); }
      t.append(el("thead", {}, head), el("tbody", {}, tr));
    }
    scroller.append(t);
    card.append(scroller);
    if (r.note) card.append(el("p", { class: "note", text: r.note }));
    box.append(card);
  }
}

/* --- rows outside the worklist ----------------------------------- */
function renderElsewhere() {
  const d = $("elsewhere");
  const log = MODEL.pair_logs[state.log];
  const list = (log && log.elsewhere) || [];
  d.hidden = list.length === 0;
  d.replaceChildren(el("summary", { text: `ワークリストに無いペアの試行 ${list.length} 件（${log ? log.name : ""}）` }),
    el("p", { class: "muted", style: "margin-top:8px;font-size:13px", text: "ワークリストの id とは違う id で記録された行です。多くは表記グループ内の別メンバー（Canonical による置き換え）です。マップには載せていませんが、ログには残っています。" }),
    el("ul", {}, ...list.map(k => el("li", { text: k }))));
}

function renderFooter() {
  $("footer").replaceChildren(
    el("div", {}, "元データ: ", el("code", { text: MODEL.sources.worklist }), " と ", el("code", { text: `${MODEL.sources.data}/trials/*.jsonl` })),
    el("div", { text: "再生成: lua tools/lua/report.lua — 実機での作業のあと、ログと一緒にコミットしてください。" }),
    el("div", { text: "試行結果は Street Fighter 6 上で測ったものです。予測確度と予測マージンはフレームデータ由来です（CC-BY-SA、docs/NOTICE.md）。" }),
    el("div", { text: "繋がったコンボの一覧は docs/ComboExplorer/combos-*.md にも書き出されます。ダメージは未計測で、公開用の記録（ce.verified_combo.v1）にはまだできません。" }),
  );
}

function renderAll() {
  renderLogSummary();
  renderLogs();
  renderGrid();
  renderDetail();
  renderElsewhere();
}

renderHeader();
renderCombos();
renderPressSummary();
state.cell = firstInteresting();
renderAll();
renderRoutes();
renderFooter();
</script>
</body>
</html>
